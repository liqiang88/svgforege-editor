<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" role="img" aria-label="SVGForge Logo" data-editor-id="svg-root" preserveAspectRatio="xMidYMid meet"><defs>
    <!-- 图标背景渐变 -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- 图标内部路径渐变 -->
    <linearGradient id="iconPath" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <!-- 火花渐变 -->
    <linearGradient id="spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <!-- 文字 Forge 渐变 -->
    <linearGradient id="textForge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs><g>
  

  <!-- ==================== 图标部分（100x100，可独立使用） ==================== -->
  <g transform="translate(10, 10)">
    <!-- 圆角方形背景 -->
    <rect x="0" y="0" width="100" height="100" rx="24" ry="24" fill="url(#iconBg)"/>

    <!-- 内部阴影增加立体感 -->
    <rect x="2" y="2" width="96" height="96" rx="22" ry="22" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!--
      核心符号：SVG 路径 + 字母 F + 锻造
      一条带节点的 SVG 路径，形状构成 F，右上角迸发火花
    -->
    <g transform="translate(22, 20)">
      <!-- F 的竖笔画（SVG 路径，带圆角） -->
      <path d="M 8 0 L 8 56" stroke="url(#iconPath)" stroke-width="7" fill="none" stroke-linecap="round"/>

      <!-- F 的上横笔画 -->
      <path d="M 8 0 L 40 0 Q 48 0 48 8 L 48 14" stroke="url(#iconPath)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- F 的中横笔画 -->
      <path d="M 8 28 L 34 28" stroke="url(#iconPath)" stroke-width="7" fill="none" stroke-linecap="round"/>

      <!-- SVG 编辑节点（路径上的控制点） -->
      <circle cx="8" cy="0" r="5.5" fill="#ffffff"/>
      <circle cx="8" cy="0" r="2.5" fill="#6366f1"/>

      <circle cx="48" cy="14" r="5.5" fill="#ffffff"/>
      <circle cx="48" cy="14" r="2.5" fill="#6366f1"/>

      <circle cx="34" cy="28" r="5.5" fill="#ffffff"/>
      <circle cx="34" cy="28" r="2.5" fill="#6366f1"/>

      <circle cx="8" cy="56" r="5.5" fill="#ffffff"/>
      <circle cx="8" cy="56" r="2.5" fill="#6366f1"/>

      <!-- 贝塞尔曲线手柄（暗示 SVG 路径编辑） -->
      <line x1="48" y1="14" x2="60" y2="4" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="60" cy="4" r="2.5" fill="rgba(255,255,255,0.6)"/>

      <!-- 锻造火花（右上角，Forge 的象征） -->
      <g transform="translate(52, -4)">
        <!-- 主火花 -->
        <path d="M 0 8 L 6 0 L 12 8 L 6 20 Z" fill="url(#spark)" opacity="0.95"/>
        <!-- 小火花1 -->
        <path d="M 14 2 L 17 -2 L 20 2 L 17 6 Z" fill="url(#spark)" opacity="0.8"/>
        <!-- 小火花2 -->
        <path d="M -2 -2 L 1 -6 L 4 -2 L 1 2 Z" fill="url(#spark)" opacity="0.7"/>
      </g>
    </g>

    <!-- 底部高光 -->
    <rect x="12" y="88" width="76" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  </g>

  <!-- ==================== 文字部分 ==================== -->
  <g transform="translate(130, 0)">
    <!-- SVG 部分（深色粗体） -->
    <text x="0" y="74" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#1e1b4b" letter-spacing="-1.5">
      SVG
    </text>
    <!-- Forge 部分（渐变色） -->
    <text x="118" y="74" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="url(#textForge)" letter-spacing="-1.5">
      Forge
    </text>

    <!-- 下方标语（可选，小字） -->
    <text x="2" y="98" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="2.5">
      FORGE PERFECT SVG ICONS
    </text>
  </g>
</g></svg>